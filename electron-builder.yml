appId: sparkle.app
productName: Sparkle
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!aur/*'
  - '!images/*'
  - '!scripts/*'
  - '!extra/*'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: './extra/'
    to: ''
protocols:
  name: 'Sparkle URI Scheme'
  schemes:
    - 'clash'
    - 'mihomo'
    - 'sparkle'
win:
  # 保留 Windows 配置，但由于 GitHub Actions 已经被限制，这些将不会被构建。
  target:
    - nsis
    - 7z
  artifactName: ${name}-windows-${version}-${arch}-portable.${ext}
nsis:
  artifactName: ${name}-windows-${version}-${arch}-setup.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
mac:
  # 保留 macOS 配置，但由于 GitHub Actions 已经被限制，这些将不会被构建。
  target:
    - pkg
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  artifactName: ${name}-macos-${version}-${arch}.${ext}
pkg:
  allowAnywhere: false
  allowCurrentUserHome: false
  # background:
  #   alignment: bottomleft
  #   file: build/background.png
linux:
  desktop:
    entry:
      Name: Sparkle
      MimeType: 'x-scheme-handler/clash;x-scheme-handler/mihomo;x-scheme-handler/sparkle'
  target:
    # 关键修改：只保留 tar.gz 格式（'tar' 是常用的 electron-builder 别名）
    - tar.gz
    # - deb # 已删除
    # - rpm # 已删除
    # - pacman # 已删除
  maintainer: xishang0128
  category: Utility
  # 由于只构建 tar.gz，可以简化 artifactName
  artifactName: ${name}-linux-${version}-${arch}.${ext}
# 以下特定格式的配置不再需要，因为它们已从 target 中删除，但保留也不会影响 tar.gz 构建。
deb:
  afterInstall: 'build/linux/postinst'
rpm:
  afterInstall: 'build/linux/postinst'
pacman:
  afterInstall: 'build/linux/postinst'
  artifactName: ${name}-linux-${version}-${arch}.pkg.tar.xz
npmRebuild: true
publish: []
